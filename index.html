<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Para ti</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
<style>
:root{--papel:#fbf5ea;--fondo:#efe3d0;--tinta:#4a3728;--terracota:#c0694a;--oliva:#6f8060;--mostaza:#d9a441;--sello:#a8432f}
*{box-sizing:border-box;margin:0}
body{background:var(--fondo);color:var(--tinta);font-family:'Fraunces',Georgia,serif;display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;padding:20px;overflow-x:hidden}
.pantalla{display:none;width:100%;max-width:420px;text-align:center}
.pantalla.activa{display:block;animation:aparecer .8s ease both}
@keyframes aparecer{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes latir{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

/* Sobre */
.para{font-family:'Caveat',cursive;font-size:2.2rem;margin-bottom:60px}
.sobre{position:relative;display:block;width:280px;height:180px;margin:0 auto;padding:0;border:0;background:#e6d3b5;border-radius:6px;box-shadow:0 14px 30px rgba(74,55,40,.25);cursor:pointer;perspective:800px}
.sobre::before{content:"";position:absolute;inset:0;border-radius:6px;z-index:2;background:linear-gradient(to top right,#dcc6a3 50%,transparent 50%),linear-gradient(to top left,#d6bf9a 50%,transparent 50%)}
.solapa{position:absolute;top:0;left:0;width:100%;height:55%;background:#d2b98f;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s ease;z-index:3}
.hoja{position:absolute;left:8%;right:8%;top:10%;height:80%;background:var(--papel);border-radius:4px;z-index:1;transition:transform .9s ease .4s}
.sello{position:absolute;left:50%;top:55%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:var(--sello);color:#fff;display:grid;place-items:center;font-size:22px;z-index:4;animation:latir 1.6s infinite;transition:opacity .3s}
.sobre.abierto .solapa{transform:rotateX(180deg);z-index:0}
.sobre.abierto .hoja{transform:translateY(-55%)}
.sobre.abierto .sello{opacity:0}
.pista{margin-top:26px;font-size:.95rem;opacity:.7}

/* Carta */
.carta{background:var(--papel);border-radius:14px;padding:20px 20px 22px;box-shadow:0 14px 34px rgba(74,55,40,.2)}
svg{width:100%;height:auto;display:block}
#yo{transform-box:fill-box;transform-origin:50% 100%;transform:scale(.42);transition:transform 1.4s cubic-bezier(.3,1.3,.5,1)}
#novia{opacity:0;transition:opacity 1.4s ease}
#novia.muestra{opacity:1}
.pulso{transform-box:fill-box;transform-origin:center;animation:latir 1.4s infinite}
#edad{font-family:'Caveat',cursive;font-size:16px;fill:var(--tinta)}
.texto{min-height:6.5em;margin:12px 0 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .4s}
.texto.oculto{opacity:0}
#frase{font-size:1.2rem;line-height:1.45}
#firma{font-family:'Caveat',cursive;font-size:1.5rem;margin-top:10px;color:var(--sello)}
.polaroid{display:none;width:62%;margin:4px auto 10px;padding:8px 8px 26px;background:#fff;box-shadow:0 6px 16px rgba(74,55,40,.25);transform:rotate(-2deg)}
.polaroid.visible{display:block;animation:aparecer .8s ease both}
.polaroid img{width:100%;display:block}
.puntos{display:flex;gap:6px;justify-content:center;margin:12px 0 16px}
.puntos i{width:7px;height:7px;border-radius:50%;background:#dccbb0}
.puntos i.on{background:var(--terracota)}
.btn{font:inherit;font-size:1rem;background:var(--terracota);color:#fff;border:0;border-radius:999px;padding:12px 30px;cursor:pointer}
.lluvia{position:fixed;top:-40px;pointer-events:none;animation:caer linear forwards}
@keyframes caer{to{transform:translateY(110vh) rotate(40deg);opacity:.2}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<section id="p-sobre" class="pantalla activa">
  <p class="para" id="para"></p>
  <button class="sobre" id="sobre" aria-label="Abrir la carta">
    <span class="hoja"></span><span class="solapa"></span><span class="sello">♥</span>
  </button>
  <p class="pista">Toca el sello para abrir</p>
</section>

<section id="p-carta" class="pantalla">
  <div class="carta">
    <svg viewBox="0 40 320 175" role="img" aria-label="Dos figuras: mi hermana y yo, que voy creciendo">
      <line x1="30" y1="190" x2="290" y2="190" stroke="#dccbb0" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/>
      <!-- Mi hermana -->
      <g fill="#c0694a">
        <circle cx="85" cy="74" r="6"/><circle cx="85" cy="90" r="14"/>
        <path d="M79 106h12l15 74H64z"/>
        <rect x="78" y="180" width="5" height="10"/><rect x="87" y="180" width="5" height="10"/>
      </g>
      <text class="pulso" x="125" y="128" text-anchor="middle" font-size="16" fill="#a8432f">♥</text>
      <!-- Yo -->
      <g id="yo" fill="#6f8060">
        <circle cx="165" cy="96" r="13"/>
        <rect x="153" y="111" width="24" height="46" rx="8"/>
        <rect x="154" y="153" width="9" height="37" rx="4"/><rect x="167" y="153" width="9" height="37" rx="4"/>
      </g>
      <text id="edad" x="165" y="208" text-anchor="middle"></text>
      <!-- Mi novia -->
      <g id="novia">
        <g fill="#d9a441">
          <circle cx="244" cy="88" r="5"/><circle cx="232" cy="92" r="13"/>
          <path d="M226 107h12l14 73h-40z"/>
          <rect x="225" y="180" width="5" height="10"/><rect x="234" y="180" width="5" height="10"/>
        </g>
        <text class="pulso" x="232" y="158" text-anchor="middle" font-size="13" fill="#fff">♥</text>
      </g>
    </svg>

    <div class="texto" id="texto"><p id="frase"></p><p id="firma"></p></div>
    <div class="polaroid" id="polaroid"><img id="foto" alt=""></div>
    <div class="puntos" id="puntos"></div>
    <button class="btn" id="btn">Continuar</button>
  </div>
</section>

<script>
/* ====== CAMBIA SOLO ESTO ====== */
const CONFIG = {
  hermana: "NOMBRE DE TU HERMANA",
  yo: "TU NOMBRE",
  novia: "NOMBRE DE TU NOVIA",
  titulo: "tía",                      // cómo la vas a llamar: tía, abuela del corazón...
  mesParto: "MES de 2027",
  recuerdo1: "PRIMER RECUERDO",       // completa la frase "Me acuerdo de ..."
  recuerdo2: "SEGUNDO RECUERDO",      // completa la frase "Y de ..."
  fotoEcografia: "ecografia.jpg"      // nombre del archivo; deja "" si no quieres foto
};
/* Para sumar una foto real a una etapa, pon el nombre del archivo en "foto". */
const C = CONFIG;
const escenas = [
  {escala:.42, edad:"2 años",  foto:"", texto:"Yo tenía 2 años cuando empezaste a cuidarme."},
  {escala:.58, edad:"6 años",  foto:"", texto:`Me acuerdo de ${C.recuerdo1}.`},
  {escala:.78, edad:"12 años", foto:"", texto:`Y de ${C.recuerdo2}.`},
  {escala:1,   edad:"18 años", foto:"", texto:"Estuviste cuando más te necesité. Nunca te lo dije lo suficiente: gracias."},
  {escala:1.1, edad:"hoy",     foto:"", texto:"Todo lo que sé sobre cuidar a alguien lo aprendí de ti."},
  {escala:1.1, edad:"", novia:true, foto:C.fotoEcografia, texto:`Y ahora me toca a mí. ¡${C.novia} y yo vamos a ser papás! Llega en ${C.mesParto}.`},
  {escala:1.1, edad:"", novia:true, final:true, foto:"", texto:`Vas a ser ${C.titulo}. Este bebé va a tener la suerte de tenerte, como la tuve yo. Llámame cuando termines de llorar.`, firma:`Con amor, ${C.yo} y ${C.novia}`}
];

const $ = id => document.getElementById(id);
let paso = 0;
$("para").textContent = "Para " + C.hermana;
$("puntos").innerHTML = escenas.map(() => "<i></i>").join("");
$("foto").onerror = () => $("polaroid").classList.remove("visible");

function mostrar(i){
  const e = escenas[i];
  $("texto").classList.add("oculto");
  setTimeout(() => {
    $("frase").textContent = e.texto;
    $("firma").textContent = e.firma || "";
    $("texto").classList.remove("oculto");
  }, 400);
  $("yo").style.transform = `scale(${e.escala})`;
  $("edad").textContent = e.edad;
  $("novia").classList.toggle("muestra", !!e.novia);
  if (e.foto) { $("foto").src = e.foto; $("polaroid").classList.add("visible"); }
  else $("polaroid").classList.remove("visible");
  [...$("puntos").children].forEach((p, n) => p.classList.toggle("on", n <= i));
  $("btn").textContent = i === escenas.length - 1 ? "Ver de nuevo" : "Continuar";
  if (e.final) lluvia();
}

function lluvia(){
  const colores = ["#c0694a", "#a8432f", "#d9a441"];
  for (let n = 0; n < 26; n++) {
    const h = document.createElement("span");
    h.className = "lluvia";
    h.textContent = "♥";
    h.style.left = Math.random() * 100 + "vw";
    h.style.fontSize = 14 + Math.random() * 20 + "px";
    h.style.color = colores[n % 3];
    h.style.animationDuration = 3 + Math.random() * 3 + "s";
    h.style.animationDelay = Math.random() * 1.5 + "s";
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 8000);
  }
}

$("sobre").addEventListener("click", () => {
  $("sobre").classList.add("abierto");
  setTimeout(() => {
    $("p-sobre").classList.remove("activa");
    $("p-carta").classList.add("activa");
    mostrar(0);
  }, 1600);
});
$("btn").addEventListener("click", () => {
  paso = (paso + 1) % escenas.length;
  mostrar(paso);
});
</script>
</body>
</html>
